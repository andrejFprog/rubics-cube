<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<title>Rubikova kostka 3×3</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#1a1a2e; font-family:Arial,sans-serif; overflow:hidden; }
#info {
  position:absolute; top:12px; left:50%; transform:translateX(-50%);
  color:#fff; background:rgba(0,0,0,0.65); padding:8px 20px;
  border-radius:20px; font-size:14px; text-align:center; z-index:10;
  white-space:nowrap;
}
#moves { color:#ffdd88; font-weight:bold; }
#status { color:#88ffdd; }
#controls {
  position:absolute; top:60px; left:50%; transform:translateX(-50%);
  display:flex; flex-wrap:wrap; gap:8px; justify-content:center;
  z-index:10; max-width:620px;
}
.grp { display:flex; flex-direction:column; align-items:center; gap:3px; }
.grp label { color:#aaa; font-size:11px; }
.row { display:flex; gap:4px; }
button {
  padding:7px 13px; font-size:13px; font-weight:bold;
  border:none; border-radius:8px; cursor:pointer;
  background:#2d2d5e; color:#fff; transition:background .12s, transform .08s;
}
button:hover { background:#4444aa; transform:scale(1.06); }
button:active { transform:scale(0.96); }
.inv { background:#3a2d5e; color:#d0b0ff; }
.inv:hover { background:#6644aa; }
.go { background:#1a5c3a; color:#7fffb0; }
.go:hover { background:#2a8c5a; }
.rst { background:#5c1a1a; color:#ffaaaa; }
.rst:hover { background:#8c2a2a; }
</style>
</head>
<body>

<div id="info">
  Tahy: <span id="moves">0</span> &nbsp;|&nbsp;
  <span id="status">Táhni myší pro otočení · tlačítka pro tahy</span>
</div>

<div id="controls">
  <div class="grp"><label>Pravá (R)</label><div class="row">
    <button onclick="doMove('R')">R</button>
    <button class="inv" onclick="doMove('Ri')">R'</button>
  </div></div>
  <div class="grp"><label>Levá (L)</label><div class="row">
    <button onclick="doMove('L')">L</button>
    <button class="inv" onclick="doMove('Li')">L'</button>
  </div></div>
  <div class="grp"><label>Horní (U)</label><div class="row">
    <button onclick="doMove('U')">U</button>
    <button class="inv" onclick="doMove('Ui')">U'</button>
  </div></div>
  <div class="grp"><label>Dolní (D)</label><div class="row">
    <button onclick="doMove('D')">D</button>
    <button class="inv" onclick="doMove('Di')">D'</button>
  </div></div>
  <div class="grp"><label>Přední (F)</label><div class="row">
    <button onclick="doMove('F')">F</button>
    <button class="inv" onclick="doMove('Fi')">F'</button>
  </div></div>
  <div class="grp"><label>Zadní (B)</label><div class="row">
    <button onclick="doMove('B')">B</button>
    <button class="inv" onclick="doMove('Bi')">B'</button>
  </div></div>
  <div class="grp"><label>&nbsp;</label><div class="row">
    <button class="go" onclick="scramble()"> Zamíchat</button>
    <button class="rst" onclick="resetCube()">↺ Reset</button>
  </div></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// celý JS zůstává stejný až k ovládání myši …

var CAM_R = 13.0;

renderer.domElement.addEventListener('mousedown', function (e) {
  dragging = true; px = e.clientX; py = e.clientY;
});
window.addEventListener('mouseup', function () { dragging = false; });


window.addEventListener('mousemove', function (e) {
  if (!dragging) return;
  rotY -= (e.clientX - px) * 0.006;
  rotX += (e.clientY - py) * 0.006; // ← změněno na +
  rotX = Math.max(-1.4, Math.min(1.4, rotX));
  px = e.clientX; py = e.clientY;
});

renderer.domElement.addEventListener('touchstart', function (e) {
  dragging = true; px = e.touches[0].clientX; py = e.touches[0].clientY;
  e.preventDefault();
}, { passive: false });
window.addEventListener('touchend', function () { dragging = false; });


window.addEventListener('touchmove', function (e) {
  if (!dragging) return;
  rotY -= (e.touches[0].clientX - px) * 0.006;
  rotX += (e.touches[0].clientY - py) * 0.006; // ← změněno na +
  rotX = Math.max(-1.4, Math.min(1.4, rotX));
  px = e.touches[0].clientX; py = e.touches[0].clientY;
  e.preventDefault();
}, { passive: false });

function animate() {
  requestAnimationFrame(animate);
  camera.position.set(
    CAM_R * Math.sin(rotY) * Math.cos(rotX),
    CAM_R * Math.sin(rotX),
    CAM_R * Math.cos(rotY) * Math.cos(rotX)
  );
  camera.lookAt(0, 0, 0);
  renderer.render(scene, camera);
}

buildCube();
animate();
</script>
</body>
</html>
